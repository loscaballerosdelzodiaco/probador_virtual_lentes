name: CI

on:
  push:
    branches:
      - main
      - 'Sprint[0-9]*'
      - 'Sprint[0-9]*/**'
  pull_request:
    branches:
      - main
      - 'Sprint[0-9]*'
      - 'Sprint[0-9]*/**'

defaults:
  run:
    working-directory: fudem-app

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fudem-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
